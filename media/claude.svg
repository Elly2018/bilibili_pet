<svg id="claude-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="100%" height="100%">
  <defs>
    <!-- Claude Anthropic Terracotta Hair Gradient -->
    <linearGradient id="claudeHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="40%" stop-color="#C2410C"/>
      <stop offset="80%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="claudeDress" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>

  <style>
    .eyes-open { animation: claudeBlink 5s infinite; transform-origin: 160px 175px; }
    @keyframes claudeBlink {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.1); }
    }
    .c-mouth-normal, .c-mouth-pet, .c-mouth-feed, .c-mouth-poke, .c-mouth-play { display: none; }
    .c-eyes-normal, .c-eyes-pet, .c-eyes-poke, .c-eyes-play { display: none; }
    .c-cheeks-blush, .c-tea-cup, .c-book-glow { display: none; }

    .state-normal .c-mouth-normal, .state-normal .c-eyes-normal { display: inline; }
    .state-pet .c-mouth-pet, .state-pet .c-eyes-pet, .state-pet .c-cheeks-blush { display: inline; }
    .state-feed .c-mouth-feed, .state-feed .c-eyes-normal, .state-feed .c-tea-cup { display: inline; }
    .state-play .c-mouth-play, .state-play .c-eyes-play, .state-play .c-book-glow { display: inline; }
    .state-poke .c-mouth-poke, .state-poke .c-eyes-poke, .state-poke .c-cheeks-blush { display: inline; }
  </style>

  <!-- Aura -->
  <circle cx="160" cy="180" r="130" fill="#D97706" opacity="0.1"/>

  <!-- BACK HAIR (Long wavy terracotta hair) -->
  <path d="M70,140 C50,180 55,250 70,310 C80,315 95,280 85,240 C100,280 120,320 135,315 C115,260 100,200 95,150 Z" fill="url(#claudeHair)"/>
  <path d="M250,140 C270,180 265,250 250,310 C240,315 225,280 235,240 C220,280 200,320 185,315 C205,260 220,200 225,150 Z" fill="url(#claudeHair)"/>

  <!-- BODY / CLOTHES (Victorian Academic Dress) -->
  <g id="claude-body">
    <rect x="146" y="215" width="28" height="25" fill="#FFF7ED" rx="4"/>
    <path d="M125,236 Q160,248 195,236 C220,255 240,310 240,335 L80,335 C80,310 100,255 125,236 Z" fill="url(#claudeDress)"/>
    <!-- Victorian Lace Collar -->
    <path d="M135,232 L160,265 L185,232 Z" fill="#FFF7ED" stroke="#FDE047" stroke-width="1.5"/>
    <!-- Terracotta Ribbon Tie & Amber Gem Brooch -->
    <path d="M152,242 L168,242 L164,272 L160,268 L156,272 Z" fill="#C2410C"/>
    <circle cx="160" cy="245" r="5" fill="url(#goldGrad)" stroke="#B45309" stroke-width="1.2"/>
  </g>

  <!-- HEAD & FACE -->
  <path d="M104,140 C104,95 216,95 216,140 C216,195 194,228 160,228 C126,228 104,195 104,140 Z" fill="#FFFBF7"/>

  <!-- Cheeks Blush -->
  <ellipse cx="126" cy="188" rx="9" ry="5" fill="#FB923C" opacity="0.3"/>
  <ellipse cx="194" cy="188" rx="9" ry="5" fill="#FB923C" opacity="0.3"/>
  <g class="c-cheeks-blush">
    <ellipse cx="126" cy="188" rx="12" ry="7" fill="#EA580C" opacity="0.55"/>
    <ellipse cx="194" cy="188" rx="12" ry="7" fill="#EA580C" opacity="0.55"/>
  </g>

  <!-- Nose -->
  <circle cx="160" cy="187" r="1.2" fill="#D97706"/>

  <!-- EYES (Normal State: Warm Amber / Intelligent & Gentle) -->
  <g class="c-eyes-normal eyes-open">
    <!-- Left Eye -->
    <ellipse cx="134" cy="168" rx="10" ry="13" fill="#451A03"/>
    <ellipse cx="134" cy="169" rx="8" ry="11" fill="#D97706"/>
    <circle cx="134" cy="170" r="4.5" fill="#78350F"/>
    <circle cx="131" cy="164" r="3" fill="#FFF"/>
    <path d="M120,161 Q134,152 148,160" fill="none" stroke="#292524" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Right Eye -->
    <ellipse cx="186" cy="168" rx="10" ry="13" fill="#451A03"/>
    <ellipse cx="186" cy="169" rx="8" ry="11" fill="#D97706"/>
    <circle cx="186" cy="170" r="4.5" fill="#78350F"/>
    <circle cx="183" cy="164" r="3" fill="#FFF"/>
    <path d="M172,160 Q186,152 200,161" fill="none" stroke="#292524" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Golden Monocle on right eye -->
  <circle cx="186" cy="168" r="15" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <!-- Monocle chain -->
  <path d="M201,168 Q212,190 205,225" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- EYES (Pet State: Tsundere soft smile / curved eyes) -->
  <g class="c-eyes-pet">
    <path d="M123,169 Q134,159 145,169" fill="none" stroke="#292524" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M175,169 Q186,159 197,169" fill="none" stroke="#292524" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- EYES (Play State: Scholarly analytical sparkle) -->
  <g class="c-eyes-play">
    <ellipse cx="134" cy="168" rx="11" ry="14" fill="#B45309"/>
    <polygon points="134,162 136,166 140,168 136,170 134,174 132,170 128,168 132,166" fill="#FFF"/>
    <ellipse cx="186" cy="168" rx="11" ry="14" fill="#B45309"/>
    <polygon points="186,162 188,166 192,168 188,170 186,174 184,170 180,168 184,166" fill="#FFF"/>
  </g>

  <!-- EYES (Poke State: Furrowed eyebrow tsundere) -->
  <g class="c-eyes-poke">
    <ellipse cx="134" cy="169" rx="8" ry="9" fill="#78350F"/>
    <ellipse cx="186" cy="169" rx="8" ry="9" fill="#78350F"/>
    <path d="M122,156 L144,163" stroke="#292524" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M198,156 L176,163" stroke="#292524" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- MOUTHS -->
  <g class="c-mouth-normal">
    <path d="M154,198 Q160,202 166,198" fill="none" stroke="#292524" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g class="c-mouth-pet">
    <path d="M153,197 Q160,207 167,197" fill="none" stroke="#C2410C" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g class="c-mouth-feed">
    <ellipse cx="160" cy="200" rx="5" ry="3.5" fill="#C2410C"/>
  </g>
  <g class="c-mouth-play">
    <path d="M153,197 Q160,209 167,197 Z" fill="#C2410C" stroke="#292524" stroke-width="1.8"/>
  </g>
  <g class="c-mouth-poke">
    <path d="M154,200 L166,198" stroke="#292524" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- FRONT HAIR & HEADBAND -->
  <!-- Lace Scholar Headband -->
  <path d="M96,120 Q160,88 224,120" stroke="#FFF7ED" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M96,120 Q160,88 224,120" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
  <!-- Front Bangs -->
  <path d="M100,128 C100,80 220,80 220,128 C205,120 185,138 170,124 C162,138 145,138 138,124 C125,136 112,120 100,128 Z" fill="url(#claudeHair)"/>
  <!-- Elegant Side Braid over shoulder -->
  <path d="M102,130 C95,160 100,195 106,230 C110,230 114,200 110,165 Z" fill="url(#claudeHair)"/>

  <!-- FEEDING: British Earl Grey Tea Cup -->
  <g class="c-tea-cup" transform="translate(138, 260)">
    <path d="M5,10 Q22,35 40,10 Z" fill="#FFF7ED" stroke="url(#goldGrad)" stroke-width="2"/>
    <ellipse cx="22" cy="10" rx="17" ry="5" fill="#9A3412"/>
    <path d="M37,13 Q48,18 36,25" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Steam from tea -->
    <path d="M18,3 Q22,-5 19,-12 M26,3 Q30,-5 27,-12" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- PLAYING: Grimoire of Code -->
  <g class="c-book-glow" transform="translate(130, 270)">
    <rect x="0" y="0" width="60" height="40" rx="3" fill="#78350F" stroke="url(#goldGrad)" stroke-width="2"/>
    <line x1="30" y1="0" x2="30" y2="40" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="30" y="24" fill="#FDE047" font-size="10" font-family="serif" text-anchor="middle">Anthropic</text>
  </g>
</svg>
