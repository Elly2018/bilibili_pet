<svg id="hajimi-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="100%" height="100%">
  <defs>
    <!-- Hair gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE"/>
      <stop offset="45%" stop-color="#6F42C1"/>
      <stop offset="80%" stop-color="#9B51E0"/>
      <stop offset="100%" stop-color="#FB7299"/>
    </linearGradient>
    <!-- Skin gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F5"/>
      <stop offset="100%" stop-color="#FFEBE5"/>
    </linearGradient>
    <!-- Cyber collar -->
    <linearGradient id="collarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D2B55"/>
      <stop offset="50%" stop-color="#5B48EE"/>
      <stop offset="100%" stop-color="#2D2B55"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    /* Dynamic expression styling controlled by parent CSS class */
    .ear-left { transform-origin: 90px 80px; animation: earTwitchLeft 6s infinite ease-in-out; }
    .ear-right { transform-origin: 230px 80px; animation: earTwitchRight 7s infinite ease-in-out; }
    @keyframes earTwitchLeft {
      0%, 90%, 100% { transform: rotate(0deg); }
      93% { transform: rotate(-8deg); }
      96% { transform: rotate(4deg); }
    }
    @keyframes earTwitchRight {
      0%, 88%, 100% { transform: rotate(0deg); }
      91% { transform: rotate(8deg); }
      95% { transform: rotate(-5deg); }
    }
    .twintail-l { transform-origin: 70px 140px; animation: floatHairL 4s infinite ease-in-out alternate; }
    .twintail-r { transform-origin: 250px 140px; animation: floatHairR 4s infinite ease-in-out alternate; }
    @keyframes floatHairL { from { transform: rotate(0deg); } to { transform: rotate(-4deg); } }
    @keyframes floatHairR { from { transform: rotate(0deg); } to { transform: rotate(4deg); } }

    /* Eye Blinking */
    .eyes-open { animation: blink 4.5s infinite; }
    @keyframes blink {
      0%, 95%, 100% { transform: scaleY(1); }
      97% { transform: scaleY(0.1); }
    }
    .eyes-open { transform-origin: 160px 175px; }

    /* Expression states */
    .mouth-normal, .mouth-pet, .mouth-feed, .mouth-poke, .mouth-play { display: none; }
    .eyes-normal, .eyes-pet, .eyes-poke, .eyes-play { display: none; }
    .cheeks-heavy, .steam-puffs, .fish-food, .hearts-float, .laser-dot { display: none; }

    /* Normal default */
    .state-normal .mouth-normal, .state-normal .eyes-normal { display: inline; }
    /* Petting */
    .state-pet .mouth-pet, .state-pet .eyes-pet, .state-pet .cheeks-heavy, .state-pet .hearts-float { display: inline; }
    /* Feeding */
    .state-feed .mouth-feed, .state-feed .eyes-pet, .state-feed .fish-food { display: inline; }
    /* Playing */
    .state-play .mouth-play, .state-play .eyes-play, .state-play .laser-dot { display: inline; }
    /* Poking / Hissing */
    .state-poke .mouth-poke, .state-poke .eyes-poke, .state-poke .cheeks-heavy, .state-poke .steam-puffs { display: inline; }
  </style>

  <!-- BACKGROUND AURA -->
  <circle cx="160" cy="180" r="130" fill="url(#hairGrad)" opacity="0.12" filter="url(#glow)"/>

  <!-- BACK HAIR / TWINTAILS -->
  <g class="twintail-l">
    <!-- Left long twintail with cosmic gradient -->
    <path d="M75,135 C35,165 15,225 25,285 C35,315 65,300 60,265 C55,225 75,185 85,155 Z" fill="url(#hairGrad)"/>
    <path d="M40,240 C35,270 45,295 55,290" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
  <g class="twintail-r">
    <!-- Right long twintail -->
    <path d="M245,135 C285,165 305,225 295,285 C285,315 255,300 260,265 C265,225 245,185 235,155 Z" fill="url(#hairGrad)"/>
    <path d="M280,240 C285,270 275,295 265,290" stroke="#FB7299" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- BODY / CLOTHES -->
  <g id="body">
    <!-- Neck -->
    <rect x="145" y="215" width="30" height="25" fill="#FFEBE5" rx="5"/>
    <!-- Cyber cat collar -->
    <path d="M136,230 Q160,240 184,230 Q184,238 160,248 Q136,238 136,230 Z" fill="url(#collarGrad)" stroke="#4FACFE" stroke-width="1.5"/>
    <!-- Collar bell / Gemini gem -->
    <circle cx="160" cy="245" r="7.5" fill="#FFD700" stroke="#FFA500" stroke-width="1.5"/>
    <circle cx="160" cy="245" r="3.5" fill="#00F2FE"/>
    
    <!-- Cyber hoodie / dress -->
    <path d="M125,236 Q160,250 195,236 C225,255 245,310 245,335 L75,335 C75,310 95,255 125,236 Z" fill="#1C1830" stroke="#373058" stroke-width="2"/>
    <!-- Clothing trim details -->
    <path d="M110,335 L125,260 L160,275 L195,260 L210,335" fill="none" stroke="url(#hairGrad)" stroke-width="2.5"/>
    <!-- Cute paw chest brooch -->
    <circle cx="160" cy="290" r="5" fill="#FB7299"/>
    <circle cx="154" cy="283" r="2" fill="#FB7299"/>
    <circle cx="160" cy="281" r="2.2" fill="#FB7299"/>
    <circle cx="166" cy="283" r="2" fill="#FB7299"/>
  </g>

  <!-- CAT EARS -->
  <g class="ear-left">
    <!-- Outer ear left -->
    <path d="M95,115 L60,40 C85,35 125,70 120,105 Z" fill="url(#hairGrad)" stroke="#6F42C1" stroke-width="2"/>
    <!-- Inner pink ear -->
    <path d="M92,105 L72,55 C88,52 110,75 108,98 Z" fill="#FFB6C1"/>
    <!-- Fluff -->
    <path d="M85,90 Q95,85 105,95" stroke="#FFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Ear earring star -->
    <polygon points="56,50 60,54 56,58 52,54" fill="#00F2FE" filter="url(#glow)"/>
  </g>
  <g class="ear-right">
    <!-- Outer ear right -->
    <path d="M225,115 L260,40 C235,35 195,70 200,105 Z" fill="url(#hairGrad)" stroke="#6F42C1" stroke-width="2"/>
    <!-- Inner pink ear -->
    <path d="M228,105 L248,55 C232,52 210,75 212,98 Z" fill="#FFB6C1"/>
    <!-- Fluff -->
    <path d="M235,90 Q225,85 215,95" stroke="#FFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Ear earring star -->
    <polygon points="264,50 268,54 264,58 260,54" fill="#FB7299" filter="url(#glow)"/>
  </g>

  <!-- HEAD & FACE -->
  <g id="head">
    <!-- Face shape -->
    <path d="M102,140 C102,95 218,95 218,140 C218,195 195,228 160,228 C125,228 102,195 102,140 Z" fill="url(#skinGrad)"/>

    <!-- Soft Cheeks Blush -->
    <ellipse cx="125" cy="188" rx="10" ry="5.5" fill="#FF7399" opacity="0.38"/>
    <ellipse cx="195" cy="188" rx="10" ry="5.5" fill="#FF7399" opacity="0.38"/>
    
    <!-- Extra Heavy Blush (when petted or poking) -->
    <g class="cheeks-heavy">
      <ellipse cx="125" cy="188" rx="13" ry="8" fill="#FF3366" opacity="0.6"/>
      <ellipse cx="195" cy="188" rx="13" ry="8" fill="#FF3366" opacity="0.6"/>
      <line x1="118" y1="184" x2="124" y2="192" stroke="#FF0055" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="125" y1="184" x2="131" y2="192" stroke="#FF0055" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="189" y1="184" x2="195" y2="192" stroke="#FF0055" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="196" y1="184" x2="202" y2="192" stroke="#FF0055" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Cute little cat nose -->
    <path d="M158,187 L162,187 L160,189 Z" fill="#E66A8A"/>

    <!-- EYES (Normal state) -->
    <g class="eyes-normal eyes-open">
      <!-- Left Eye (Gemini Cyan / Starry Blue) -->
      <g id="eye-left">
        <ellipse cx="132" cy="168" rx="11" ry="14" fill="#0E1626"/>
        <ellipse cx="132" cy="169" rx="9" ry="12" fill="#00D2FF"/>
        <circle cx="132" cy="170" r="5" fill="#0077B6"/>
        <!-- Pupil sparkles -->
        <circle cx="128" cy="164" r="3.5" fill="#FFFFFF"/>
        <circle cx="135" cy="174" r="1.8" fill="#FFFFFF"/>
        <polygon points="132,166 133,169 135,169 133,171 134,173 132,171 130,173 131,171 129,169 131,169" fill="#E0F7FA"/>
        <!-- Eyelash -->
        <path d="M118,162 Q132,151 146,160" fill="none" stroke="#251B38" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M142,157 L147,153" stroke="#251B38" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <!-- Right Eye (Astral Magenta / Bilibili Pink) -->
      <g id="eye-right">
        <ellipse cx="188" cy="168" rx="11" ry="14" fill="#240D1D"/>
        <ellipse cx="188" cy="169" rx="9" ry="12" fill="#FB7299"/>
        <circle cx="188" cy="170" r="5" fill="#B01E68"/>
        <!-- Pupil sparkles -->
        <circle cx="184" cy="164" r="3.5" fill="#FFFFFF"/>
        <circle cx="191" cy="174" r="1.8" fill="#FFFFFF"/>
        <polygon points="188,166 189,169 191,169 189,171 190,173 188,171 186,173 187,171 185,169 187,169" fill="#FFF0F5"/>
        <!-- Eyelash -->
        <path d="M174,160 Q188,151 202,162" fill="none" stroke="#251B38" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M178,157 L173,153" stroke="#251B38" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- EYES (Petting / Happy State: ^ ‿ ^) -->
    <g class="eyes-pet">
      <path d="M120,170 Q132,157 144,170" fill="none" stroke="#251B38" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M176,170 Q188,157 200,170" fill="none" stroke="#251B38" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M140,165 L145,161" stroke="#251B38" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M180,165 L175,161" stroke="#251B38" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- EYES (Play State: ✧ ‿ ✧ sparkling dilated) -->
    <g class="eyes-play">
      <ellipse cx="132" cy="168" rx="12" ry="15" fill="#00E5FF"/>
      <circle cx="132" cy="168" r="8" fill="#0A2540"/>
      <circle cx="128" cy="162" r="4.5" fill="#FFFFFF"/>
      <circle cx="136" cy="173" r="2.5" fill="#FFFFFF"/>
      <polygon points="132,160 134,166 140,168 134,170 132,176 130,170 124,168 130,166" fill="#FFF"/>

      <ellipse cx="188" cy="168" rx="12" ry="15" fill="#FF4081"/>
      <circle cx="188" cy="168" r="8" fill="#3A0D26"/>
      <circle cx="184" cy="162" r="4.5" fill="#FFFFFF"/>
      <circle cx="192" cy="173" r="2.5" fill="#FFFFFF"/>
      <polygon points="188,160 190,166 196,168 190,170 188,176 186,170 180,168 186,166" fill="#FFF"/>

      <path d="M118,160 Q132,148 146,158" fill="none" stroke="#251B38" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M174,158 Q188,148 202,160" fill="none" stroke="#251B38" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- EYES (Poke / Hiss State: > 皿 < or sharp tsundere) -->
    <g class="eyes-poke">
      <!-- Sharp squinted eyes > < -->
      <path d="M120,164 L134,171 L120,178" fill="none" stroke="#251B38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M200,164 L186,171 L200,178" fill="none" stroke="#251B38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Angry eyebrows -->
      <path d="M120,154 L142,160" stroke="#251B38" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M200,154 L178,160" stroke="#251B38" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- MOUTHS -->
    <!-- Normal Cat mouth :3 -->
    <g class="mouth-normal">
      <path d="M152,198 Q156,203 160,199 Q164,203 168,198" fill="none" stroke="#2B203E" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Petting Happy mouth: wide smiling open cat mouth -->
    <g class="mouth-pet">
      <path d="M150,197 Q160,214 170,197 Z" fill="#FB7299" stroke="#2B203E" stroke-width="2"/>
      <path d="M155,203 Q160,211 165,203" fill="#FFB6C1"/>
    </g>

    <!-- Feeding mouth: chewing with fish cracker -->
    <g class="mouth-feed">
      <path d="M152,198 Q160,208 168,198 Z" fill="#FB7299" stroke="#2B203E" stroke-width="2"/>
    </g>

    <!-- Play mouth: excited open :D -->
    <g class="mouth-play">
      <ellipse cx="160" cy="202" rx="7" ry="9" fill="#FB7299" stroke="#2B203E" stroke-width="2"/>
      <ellipse cx="160" cy="206" rx="5" ry="4" fill="#FF99BB"/>
      <!-- Tiny cute fang -->
      <polygon points="155,196 158,196 156,200" fill="#FFF"/>
    </g>

    <!-- Poke / Hiss mouth: cute triangular hissing mouth with fang ▲ -->
    <g class="mouth-poke">
      <path d="M150,197 Q160,194 170,197 Q166,211 154,211 Z" fill="#80102B" stroke="#2B203E" stroke-width="2.5"/>
      <!-- Sharp little vampire cat fangs! -->
      <polygon points="152,197 156,197 154,203" fill="#FFF"/>
      <polygon points="164,197 168,197 166,203" fill="#FFF"/>
      <path d="M155,207 Q160,209 165,207" stroke="#FF4D79" stroke-width="1.5" fill="none"/>
    </g>
  </g>

  <!-- FRONT BANGS & HAIR -->
  <g id="front-hair">
    <!-- Bangs -->
    <path d="M100,125 C100,75 220,75 220,125 C205,115 185,135 175,122 C168,138 152,138 145,122 C135,135 115,115 100,125 Z" fill="url(#hairGrad)"/>
    <!-- Center delicate hair strands -->
    <path d="M155,100 Q158,135 163,142 Q166,130 168,105" fill="url(#hairGrad)"/>
    <path d="M140,105 Q145,130 148,136" fill="none" stroke="#4FACFE" stroke-width="2" opacity="0.6"/>
    <!-- Side hair tufts covering cheeks -->
    <path d="M102,125 C98,155 106,190 115,205 C113,185 112,155 116,135 Z" fill="url(#hairGrad)"/>
    <path d="M218,125 C222,155 214,190 205,205 C207,185 208,155 204,135 Z" fill="url(#hairGrad)"/>

    <!-- Gemini 4-pointed Sparkle Hair Clips -->
    <!-- Left Star Clip (Cyan) -->
    <g transform="translate(100, 115)">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#00F2FE" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
    <!-- Right Star Clip (Pink) -->
    <g transform="translate(220, 115)">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#FB7299" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- INTERACTIVE OVERLAY EFFECTS -->
  <!-- 1. Feeding Snack: Grilled Little Fish Cracker -->
  <g class="fish-food" transform="translate(142, 195)">
    <!-- Crispy golden fish -->
    <path d="M-10,5 C0,-5 25,-2 35,5 C25,12 0,15 -10,5 Z" fill="#FFA726" stroke="#E65100" stroke-width="1.5"/>
    <!-- Fish tail -->
    <polygon points="-10,5 -20,-2 -17,5 -20,12" fill="#FFA726" stroke="#E65100" stroke-width="1.5"/>
    <!-- Eye & gills -->
    <circle cx="28" cy="4" r="1.5" fill="#3E2723"/>
    <path d="M20,1 Q23,5 20,9" stroke="#E65100" stroke-width="1.2" fill="none"/>
    <!-- Bite crumbs -->
    <circle cx="2" cy="-4" r="1.5" fill="#FFCC80"/>
    <circle cx="8" cy="14" r="1" fill="#FFCC80"/>
  </g>

  <!-- 2. Petting Hearts -->
  <g class="hearts-float">
    <path d="M85,100 C80,90 65,95 75,110 L85,120 L95,110 C105,95 90,90 85,100 Z" fill="#FB7299" opacity="0.85" filter="url(#glow)"/>
    <path d="M235,95 C230,85 215,90 225,105 L235,115 L245,105 C255,90 240,85 235,95 Z" fill="#00F2FE" opacity="0.85" filter="url(#glow)"/>
    <path d="M160,80 C156,72 144,76 152,88 L160,96 L168,88 C176,76 164,72 160,80 Z" fill="#FF4081" opacity="0.9" filter="url(#glow)"/>
  </g>

  <!-- 3. Poking Steam Puffs & Anger Mark (哈气 / 炸毛) -->
  <g class="steam-puffs">
    <!-- Steam from left ear -->
    <path d="M50,45 Q40,35 48,25 Q58,35 50,45 Z" fill="#FFF" opacity="0.85"/>
    <circle cx="42" cy="20" r="4" fill="#FFF" opacity="0.75"/>
    <!-- Steam from right ear -->
    <path d="M270,45 Q280,35 272,25 Q262,35 270,45 Z" fill="#FFF" opacity="0.85"/>
    <circle cx="278" cy="20" r="4" fill="#FFF" opacity="0.75"/>
    <!-- Iconic Anime Anger Cross Mark 💢 -->
    <g transform="translate(195, 80)">
      <path d="M-8,-2 L8,-2 M-8,2 L8,2 M-2,-8 L-2,8 M2,-8 L2,8" stroke="#FF1744" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Cat hiss text sound effect bubble -->
    <g transform="translate(205, 145)">
      <rect x="0" y="0" width="60" height="26" rx="8" fill="#FF1744"/>
      <text x="30" y="18" fill="#FFF" font-family="'Segoe UI', 'PingFang SC', sans-serif" font-weight="900" font-size="14" text-anchor="middle">哈气！</text>
    </g>
  </g>

  <!-- 4. Play Laser Dot / Feather Wand -->
  <g class="laser-dot">
    <circle cx="160" cy="225" r="5" fill="#FF1744" filter="url(#glow)"/>
    <circle cx="160" cy="225" r="2" fill="#FFF"/>
    <!-- Laser sparkle trails -->
    <line x1="160" y1="215" x2="160" y2="235" stroke="#FF5252" stroke-width="1.5"/>
    <line x1="150" y1="225" x2="170" y2="225" stroke="#FF5252" stroke-width="1.5"/>
  </g>

</svg>
